<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rues de Paris - Arrondissements</title>
    <link rel="stylesheet" href="style/style.css" />
    <meta property="og:title" content="les rues de paris par arrondissement" />
    <meta
      property="og:description"
      content="Site inutile pour voir les rues par arrondissement dans paris"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="https://unrk.github.io/streets/" />
    <meta name="theme-color" content="#f98128" />
  </head>
  <body>
    <main>
      <h1>
        besoin de connaitre
        <span id="rotateHeading" class="rotatingName"></span>
      </h1>

      <div class="container-2">
        <div class="search-bar">
          <form
            role="search"
            aria-label="Recherche d'une rue"
            class="search-form"
          >
            <label for="street-search" class="visually-hidden"
              >Rechercher</label>
            <span class="search-icon" aria-hidden="true"></span>
            <input
              type="search"
              id="street-search"
              name="street"
              placeholder="Tapez ici votre recherche..."
              autocomplete="off"
            />
            <button
              type="reset"
              class="search-clear"
              aria-label="Effacer la recherche"
            ></button>
          </form>
          <div class="search-results" aria-live="polite"></div>
        </div>
      </div>
    </main>

    <script src="scripts/app.js"></script>
  </body>
</html>
